[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leaf-model-installer"
version = "0.4.0"
description = "Plan-first, resumable installer for the canonical LeafOS local-model registry."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "huggingface_hub>=0.23.0,<2"
]

[project.scripts]
leaf-models = "leaf_models.install_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["leaf_models*"]

[tool.setuptools.package-data]
leaf_models = ["model_catalog.json"]
