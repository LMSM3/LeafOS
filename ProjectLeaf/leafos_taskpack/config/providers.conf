# config/providers.conf
# LeafOS provider routing registry.
#
# LEAF_PROVIDER_MODE selects which adapter leaf_provider_route dispatches to.
#   mock      -- test fixture only; rejected unless LEAF_ENABLE_TEST_MOCK_PROVIDER=1
#   openai    -- OpenAI Chat Completions (requires OPENAI_API_KEY)
#   anthropic -- Anthropic Messages API (requires ANTHROPIC_API_KEY)
#   deepseek  -- DeepSeek Chat API (requires DEEPSEEK_API_KEY)
#   web       -- broker-authenticated HTTPS JSONL pipe (disabled by default)
#   llamacpp  -- local llama.cpp HTTP server (no key required)
#   zai|glm   -- optional Z.AI OpenAI-compatible planner/reviewer adapter
#
# The configured local llama.cpp stack is the production default. CPU execution
# and validation remain available when a model lane is explicitly set to off.
# Nothing in this file is executable. Config only.

LEAF_PROVIDER_MODE="${LEAF_PROVIDER_MODE:-llamacpp}"
LEAF_ENABLE_TEST_MOCK_PROVIDER="${LEAF_ENABLE_TEST_MOCK_PROVIDER:-0}"
LEAF_WEB_MODEL_CONFIG="${LEAF_WEB_MODEL_CONFIG:-${LEAF_CONFIG_DIR}/web-model.json}"

# Default model hints per provider (adapters may override).
LEAF_OPENAI_MODEL="${LEAF_OPENAI_MODEL:-gpt-4o}"
LEAF_ANTHROPIC_MODEL="${LEAF_ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}"
LEAF_DEEPSEEK_MODEL="${LEAF_DEEPSEEK_MODEL:-deepseek-coder}"
LEAF_LLAMACPP_URL="${LEAF_LLAMACPP_URL:-http://127.0.0.1:8080}"
LEAF_LLAMACPP_CHAT_URL="${LEAF_LLAMACPP_CHAT_URL:-${LEAF_LLAMACPP_URL}/v1/chat/completions}"
LEAF_LLAMACPP_MODEL="${LEAF_LLAMACPP_MODEL:-local-vulkan}"
LEAF_LLAMACPP_MAX_TOKENS="${LEAF_LLAMACPP_MAX_TOKENS:-512}"
# No remote Z.AI model is selected by default. GLM-5.2 is deprecated for this
# host policy; using this optional adapter requires an explicit model name.
LEAF_ZAI_MODEL="${LEAF_ZAI_MODEL:-}"
LEAF_ZAI_BASE_URL="${LEAF_ZAI_BASE_URL:-https://api.z.ai/api/paas/v4}"
LEAF_ZAI_CODING_BASE_URL="${LEAF_ZAI_CODING_BASE_URL:-https://api.z.ai/api/coding/paas/v4}"
LEAF_ZAI_REASONING_EFFORT="${LEAF_ZAI_REASONING_EFFORT:-medium}"
LEAF_ZAI_RESPONSE_FORMAT="${LEAF_ZAI_RESPONSE_FORMAT:-text}"

# API key env var names (values are never stored here).
LEAF_OPENAI_KEY_VAR="OPENAI_API_KEY"
LEAF_ANTHROPIC_KEY_VAR="ANTHROPIC_API_KEY"
LEAF_DEEPSEEK_KEY_VAR="DEEPSEEK_API_KEY"
LEAF_ZAI_KEY_VAR="ZAI_API_KEY"

# Authority boundary (WO-006-C/D): remote providers may advise planner/reviewer
# lanes, but the CPU/local lane owns coding, filesystem work, validation, and
# release gates. Override a lane explicitly only when its contract is reviewed.
LEAF_CODER_PROVIDER="${LEAF_CODER_PROVIDER:-off}"

# Plan generation temperature / max tokens (used by API adapters).
LEAF_PROVIDER_TEMPERATURE="${LEAF_PROVIDER_TEMPERATURE:-0.2}"
LEAF_PROVIDER_MAX_TOKENS="${LEAF_PROVIDER_MAX_TOKENS:-12000}"
