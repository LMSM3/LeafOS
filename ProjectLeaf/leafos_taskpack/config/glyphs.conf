# LeafOS symbolic glyph registry -- canonical machine-safe source of truth.
#
# Design rule: soft surface, hard backend.
#   - Glyphs are NEVER stored raw here; only their Unicode codepoints are.
#   - The runtime (core/glyphs/glyphs.sh, LeafOS.psm1) renders codepoints to
#     UTF-8 on demand, so this file stays pure ASCII and cannot mojibake.
#
# Row format (pipe-delimited, 6 fields):
#   alias|codepoints|category|severity|ascii|meaning
#
#   alias      machine-safe id, e.g. leaf.verify
#   codepoints space-separated hex Unicode scalar values, e.g. "26A0 FE0E"
#   category   identity|growth|flower|flow|model|verify|status|loading|io|data|cosmetic
#   severity   none|info|ok|warn|error  (alert resolves severity at call time)
#   ascii      degraded fallback when NO_EMOJI=1 (must not contain '|')
#   meaning    human-readable description
#
# Doctrine:
#   leaf.verify     means verified (checks actually ran)
#   leaf.checkpoint means checkpointed after verification
#   leaf.alert warn means proceed carefully; leaf.alert error means stop
#   loading.a..d    means the machine is thinking

