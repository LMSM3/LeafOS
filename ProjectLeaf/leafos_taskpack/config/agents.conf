# config/agents.conf
# CLI-first agent profile registry for LeafOS.
# This is intentionally simple shell config, because YAML is what happens when indentation gets tenure.

DEFAULT_AGENT_PROFILE="local-coder"
AGENT_PLAN_DIR="tasks"
AGENT_REPORT_DIR="reports"
AGENT_SAFE_MODE=1
AGENT_REQUIRE_CONFIRM=1

# Profile names are listed here. Details live in core/agent/agent.sh for now.
AGENT_PROFILES="planner local-coder reviewer shell-guardian"
