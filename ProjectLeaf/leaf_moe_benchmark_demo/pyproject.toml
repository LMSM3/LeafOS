[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leaf-moe-benchmark-demo"
version = "0.1.0"
description = "Isolated MOE-001 model inventory and llama.cpp benchmark evidence demo."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
leaf-moe-bench = "leaf_moe_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["leaf_moe_bench*"]

[tool.setuptools.package-data]
leaf_moe_bench = ["default_matrix.json"]

[tool.setuptools.data-files]
"share/leaf-moe-benchmark-demo/schemas" = ["schemas/*.json"]
